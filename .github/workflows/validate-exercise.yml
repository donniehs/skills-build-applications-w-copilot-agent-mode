name: Validate Exercise

on:
  pull_request:
    paths:
      - ".github/**"
      - ".devcontainer/**"
      - ".vscode/**"
      - "README.md"
      - "docs/**"
      - "tests/**"
      - "octofit-tracker/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - ".devcontainer/**"
      - ".vscode/**"
      - "README.md"
      - "docs/**"
      - "tests/**"
      - "octofit-tracker/**"

permissions: {}

jobs:
  validate:
    name: Validate exercise metadata and scaffold
    # Maintainer-only: learner copies are not templates and are graded by the step workflows instead.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
